<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6f8">
<title>Rose &amp; Forme — votre équilibre au quotidien</title>
<style>
:root{--pink:#d96e8d;--pink-dark:#a94365;--rose:#f7dce4;--pale:#fff6f8;--cream:#fffdfb;--ink:#493b40;--muted:#8b7b81;--green:#759b7b;--line:#f0e2e6;--shadow:0 12px 35px #6f334014;--radius:22px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff7f9,#fffdfb 370px);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}button,input,select{font:inherit}button{cursor:pointer}header{padding:calc(22px + env(safe-area-inset-top)) 20px 14px;max-width:1000px;margin:auto}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:16px;background:var(--rose);display:grid;place-items:center;font-size:23px}.brand h1{font-size:21px;line-height:1.1;margin:0;color:var(--pink-dark);letter-spacing:-.4px}.brand small{color:var(--muted);font-size:12px}.date-line{display:flex;align-items:center;justify-content:space-between;margin-top:18px;color:var(--muted);font-size:13px}.date-line input{border:0;background:#ffffffa8;color:var(--ink);padding:8px 10px;border-radius:12px}.wrap{max-width:1000px;padding:0 16px;margin:auto}.content{min-height:55vh}.card{background:#fff;border:1px solid #f6e8ec;border-radius:var(--radius);padding:19px;margin:12px 0;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 12px}.card h2{font-size:20px}.card h3{font-size:16px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{background:linear-gradient(135deg,#f8dfe6,#fff0f3 60%,#fff);padding:22px}.hero h2{font-size:23px;margin-bottom:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:17px}.stat{background:#ffffffb8;border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:19px;color:var(--pink-dark)}.stat span{font-size:11px;color:var(--muted)}.progress{height:11px;background:#f2e7ea;border-radius:20px;overflow:hidden;margin:12px 0 6px}.progress i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#e9a1b5,#cf6584);transition:width .3s}.alert{padding:11px 13px;border-radius:14px;background:#fff2e8;color:#9b5b28;margin:10px 0;font-size:13px}.good{background:#eff7ef;color:#527c59}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fffdfbf2;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));max-width:1000px;margin:auto}.tabs button{border:0;background:none;color:#9c8b91;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;min-width:52px;padding:5px 3px;border-radius:13px}.tabs button span{font-size:19px}.tabs button.active{color:var(--pink-dark);background:#fff0f3;font-weight:700}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:650;color:#78666d;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--line);background:#fffdfd;border-radius:12px;padding:11px 12px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#df91a7;box-shadow:0 0 0 3px #f7dce466}.row{display:flex;gap:9px;align-items:end}.row>*{flex:1;min-width:0}.btn{border:0;border-radius:13px;background:var(--pink);color:white;padding:11px 15px;font-weight:700;box-shadow:0 5px 12px #d96e8d2b}.btn:hover{background:var(--pink-dark)}.btn.secondary{background:#fff0f3;color:var(--pink-dark);box-shadow:none}.btn.ghost{background:#f8f3f4;color:#705d64;box-shadow:none}.btn.danger{background:#fff0ed;color:#b2514b;box-shadow:none}.btn.smallbtn{padding:7px 10px;font-size:12px}.btn.full{width:100%;margin-top:7px}.list{display:flex;flex-direction:column;gap:8px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;background:#fff9fa;border-radius:14px}.item strong{font-size:14px}.item .meta{font-size:12px;color:var(--muted)}.item-actions{display:flex;align-items:center;gap:6px}.pill{display:inline-block;background:#fbe9ee;color:#a64e68;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700}.empty{text-align:center;padding:22px 10px;color:var(--muted)}.empty b{display:block;color:#76666c;margin-bottom:3px}.food-results{max-height:210px;overflow:auto;margin-top:6px}.food-choice{width:100%;border:0;background:white;text-align:left;padding:9px 10px;border-bottom:1px solid #f6ecef;color:var(--ink);display:flex;justify-content:space-between}.food-choice:hover{background:#fff4f6}.recipe-ing{display:grid;grid-template-columns:1fr 85px 36px;gap:7px;align-items:center;margin:7px 0}.recipe-ing select,.recipe-ing input{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:white}.recipe-ing button{border:0;background:#fff0f3;color:var(--pink-dark);border-radius:10px;height:38px}.chart{width:100%;height:220px}.daymenu{border-left:3px solid #e8a1b4;padding:3px 0 3px 12px;margin:9px 0}.daymenu strong{color:var(--pink-dark)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.notice{font-size:12px;color:var(--muted);margin-top:8px}.footer{padding:20px;text-align:center;color:#aa9aa0;font-size:11px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.section-title h2{margin:0}.kcal{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pink-dark)}
@media(min-width:700px){body{padding-bottom:25px}header{padding-top:30px}.tabs{position:sticky;top:0;bottom:auto;border:1px solid var(--line);border-radius:18px;margin:8px auto 18px;padding:8px;box-shadow:var(--shadow)}.tabs button{flex-direction:row;font-size:13px;gap:7px;padding:9px 15px}.content{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.content>.wide{grid-column:1/-1}.footer{padding-bottom:10px}}
@media(max-width:390px){.card{padding:16px}.stats{gap:5px}.stat{padding:10px 5px}.tabs button{min-width:47px;font-size:9px}.row.wrap-mobile{flex-wrap:wrap}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">🌷</div><div><h1>Rose &amp; Forme</h1><small>Votre équilibre, à votre rythme</small></div></div><div class="date-line"><span>Une journée pour prendre soin de vous ✨</span><input id="currentDate" type="date" aria-label="Choisir le jour"></div></header>
<div class="wrap"><nav class="tabs" aria-label="Rubriques" id="tabs"></nav><main class="content" id="app"></main><div class="footer">Prenez soin de vous avec douceur · Les estimations sont indicatives.</div></div>
<script>
(()=>{'use strict';
const TARGET=1650,MIN=1300, today=()=>new Date().toISOString().slice(0,10);
const foods=[['Avoine',389],['Amandes',579],['Avocat',160],['Banane',89],['Beurre',717],['Brocoli',34],['Carotte',41],['Champignon',22],['Chocolat noir',598],['Concombre',15],['Courgette',17],['Épinards',23],['Farine de blé',364],['Fraise',32],['Fromage blanc 0%',45],['Fromage de chèvre',364],['Lentilles cuites',116],['Miel',304],['Noix',654],['Œuf',143],['Pain complet',247],['Pâtes cuites',158],['Poulet cuit',165],['Quinoa cuit',120],['Riz cuit',130],['Saumon',208],['Salade verte',15],['Tomate',18],['Tofu',144],['Yaourt nature',61],['Huile d’olive',884],['Pois chiches cuits',164],['Patate douce',86],['Pomme',52],['Crevettes',99],['Feta',265],['Maïs',96],['Thon au naturel',116],['Lait demi-écrémé',47],['Framboise',52]].map(([name,kcal])=>({name,kcal}));
const defaults={logs:{},recipes:[],sports:[],weights:[],goalWeight:65,active:'home'};let state;
try{state={...defaults,...JSON.parse(localStorage.getItem('rose-forme-v1')||'{}')};}catch{state={...defaults}}
const dateEl=document.getElementById('currentDate');dateEl.value=today();let day=dateEl.value;
const save=()=>localStorage.setItem('rose-forme-v1',JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const log=()=>state.logs[day]||(state.logs[day]={foods:[],sports:[]});const consumed=()=>log().foods.reduce((n,x)=>n+x.kcal,0);const burned=()=>log().sports.reduce((n,x)=>n+(+x.kcal||0),0);const foodOptions=(selected='')=>foods.map((f,i)=>`<option value="${i}" ${String(i)===String(selected)?'selected':''}>${esc(f.name)} — ${f.kcal} kcal/100 g</option>`).join('');
const tabs=[['home','🏡','Accueil'],['nutrition','🍓','Nutrition'],['recipes','🥗','Recettes'],['sport','🏃','Sport'],['menus','🍽️','Menus'],['weight','⚖️','Poids']];
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,ico,label])=>`<button class="${state.active===id?'active':''}" data-tab="${id}"><span>${ico}</span>${label}</button>`).join('')}
function home(){let c=consumed(),pct=Math.min(c/TARGET*100,100);return `<section class="card hero wide"><h2>Bonjour, prenez soin de vous 🌸</h2><div class="muted">Chaque petit choix compte. Avancez avec bienveillance.</div><div class="progress"><i style="width:${pct}%"></i></div><div class="small muted">${Math.round(c)} / ${TARGET} kcal consommées aujourd’hui</div><div class="stats"><div class="stat"><b>${Math.round(c)}</b><span>kcal consommées</span></div><div class="stat"><b>${TARGET-c}</b><span>kcal restantes</span></div><div class="stat"><b>${Math.round(burned())}</b><span>kcal activité</span></div></div>${c>0&&c<MIN?'<div class="alert">🌿 Votre apport est inférieur au seuil indicatif de 1 300 kcal. Pensez à manger suffisamment et à écouter votre corps.</div>':''}${c>=MIN?'<div class="alert good">✨ Vous avez dépassé le seuil minimum de 1 300 kcal. Belle journée !</div>':''}</section><section class="card"><h3>Dans votre journal</h3>${log().foods.length?`<div class="list">${log().foods.slice(-4).reverse().map(x=>`<div class="item"><div><strong>${esc(x.name)}</strong><div class="meta">${x.grams} g</div></div><b class="kcal">${Math.round(x.kcal)} kcal</b></div>`).join('')}</div>`:'<div class="empty">🌼<b>Votre journée commence ici</b>Ajoutez un aliment depuis Nutrition.</div>'}<button class="btn secondary full" data-goto="nutrition">+ Ajouter à mon journal</button></section><section class="card"><h3>Votre intention du jour</h3><p class="muted">Boire un verre d’eau, bouger un peu, manger avec plaisir : choisissez ce qui vous fait du bien. 💗</p><button class="btn secondary" data-goto="sport">Ajouter une activité</button></section>`}
function nutrition(){let entries=log().foods;return `<section class="card wide"><div class="section-title"><h2>Nutrition &amp; journal</h2><span class="pill">Objectif ${TARGET} kcal</span></div><p class="muted small">Recherchez un aliment, indiquez la quantité consommée et ajoutez-la à votre journée.</p><div class="field"><label for="foodSearch">Rechercher dans le catalogue alimentaire</label><input id="foodSearch" type="search" placeholder="Ex. pomme, poulet, avoine…" autocomplete="off"></div><div id="foodResults" class="food-results"></div><div class="row"><div class="field"><label for="foodSelect">Aliment</label><select id="foodSelect">${foodOptions()}</select></div><div class="field" style="max-width:110px"><label for="foodGrams">Quantité (g)</label><input id="foodGrams" type="number" min="1" value="100" inputmode="decimal"></div></div><div class="small muted" id="foodCalc">100 g = ${foods[0].kcal} kcal</div><button class="btn full" id="addFood">Ajouter au journal</button></section><section class="card wide"><div class="section-title"><h3>Journal du ${new Date(day+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</h3><b class="kcal">${Math.round(consumed())} kcal</b></div>${entries.length?`<div class="list">${entries.map((x,i)=>`<div class="item"><div><strong>${esc(x.name)}</strong><div class="meta">${x.grams} g · ${Math.round(x.kcal/Math.max(1,x.grams)*100)} kcal/100 g</div></div><div class="item-actions"><b class="kcal">${Math.round(x.kcal)}</b><button class="btn danger smallbtn" data-remove-food="${i}" aria-label="Supprimer">✕</button></div></div>`).join('')}</div>`:'<div class="empty"><b>Aucun aliment enregistré</b>Votre journal se remplira au fil de la journée.</div>'}</section><section class="card wide"><h3>Repères du jour</h3><div class="progress"><i style="width:${Math.min(consumed()/TARGET*100,100)}%"></i></div><div class="small muted">${Math.max(0,TARGET-Math.round(consumed()))} kcal avant l’objectif · seuil minimum indicatif : ${MIN} kcal</div></section>`}
const ingRow=()=>`<div class="recipe-ing"><select class="ing-food">${foodOptions()}</select><input class="ing-grams" type="number" min="1" value="100" aria-label="Quantité en grammes"><button type="button" class="remove-ing" aria-label="Retirer ingrédient">×</button></div>`;
function recipes(){return `<section class="card wide"><h2>Créateur de recettes &amp; salades</h2><p class="muted small">Composez une recette, choisissez les portions : les calories sont calculées à partir des quantités.</p><div class="field"><label>Nom de la recette</label><input id="recipeName" placeholder="Ex. salade colorée"></div><div id="ingredients">${ingRow()}</div><div class="row"><button class="btn secondary" id="addIngredient" type="button">＋ Ingrédient</button><div class="field"><label>Nombre de portions</label><input id="portions" type="number" min="1" value="2"></div></div><div class="alert good" id="recipeTotal">Total recette : 0 kcal · par portion : 0 kcal</div><button class="btn full" id="saveRecipe">Enregistrer la recette</button></section><section class="card wide"><h3>Mes recettes</h3>${state.recipes.length?`<div class="list">${state.recipes.map((r,i)=>`<div class="item"><div><strong>${esc(r.name)}</strong><div class="meta">${r.portions} portion(s) · ${r.ingredients.map(x=>esc(x.name)).join(', ')}</div></div><div class="item-actions"><span class="kcal">${Math.round(r.perPortion)} kcal/portion</span><button class="btn smallbtn" data-recipe-add="${i}" title="Ajouter une portion au journal">+</button><button class="btn danger smallbtn" data-recipe-remove="${i}" aria-label="Supprimer">✕</button></div></div>`).join('')}</div>`:'<div class="empty"><b>Pas encore de recette</b>Créez votre première salade ou recette personnalisée.</div>'}</section>`}
function sport(){let items=log().sports;return `<section class="card"><h2>Cardio &amp; activité</h2><p class="small muted">Estimation basée sur une intensité modérée et le poids moyen adulte ; elle varie selon chacun.</p><div class="field"><label>Activité</label><select id="activity"><option value="run">Course à pied</option><option value="walk">Marche</option><option value="hike">Randonnée</option></select></div><div class="row"><div class="field"><label>Distance (km)</label><input id="distance" type="number" min="0" step="0.1" placeholder="5"></div><div class="field"><label>Durée (min)</label><input id="duration" type="number" min="1" placeholder="30"></div></div><div class="small muted" id="cardioEstimate">Calories estimées : —</div><button class="btn full" id="addCardio">Enregistrer l’activité</button></section><section class="card"><h2>Musculation</h2><div class="field"><label>Groupe musculaire</label><select id="muscle"><option>Jambes</option><option>Fessiers</option><option>Dos</option><option>Poitrine</option><option>Épaules</option><option>Bras</option><option>Abdominaux</option><option>Corps entier</option></select></div><div class="row"><div class="field"><label>Exercice</label><input id="exercise" placeholder="Ex. squats"></div><div class="field"><label>Séries</label><input id="sets" type="number" min="1" value="3"></div></div><div class="row"><div class="field"><label>Répétitions</label><input id="reps" type="number" min="1" value="10"></div><div class="field"><label>Charge (kg)</label><input id="load" type="number" min="0" step="0.5" value="0"></div></div><button class="btn full" id="addStrength">Ajouter l’exercice</button></section><section class="card wide"><div class="section-title"><h3>Activités du jour</h3><b class="kcal">${Math.round(burned())} kcal estimées</b></div>${items.length?`<div class="list">${items.map((x,i)=>`<div class="item"><div><strong>${esc(x.name)}</strong><div class="meta">${esc(x.detail)}</div></div><div class="item-actions"><span class="kcal">${x.kcal?Math.round(x.kcal)+' kcal':'Muscu'}</span><button class="btn danger smallbtn" data-remove-sport="${i}">✕</button></div></div>`).join('')}</div>`:'<div class="empty"><b>Aucune activité pour le moment</b>Votre mouvement, à votre rythme.</div>'}</section>`}
const menuDays=[['Lundi','Yaourt nature, flocons d’avoine et fruits','Salade de quinoa, poulet et légumes','Saumon, courgettes et salade verte'],['Mardi','Pain complet, œuf et tomate','Lentilles, carottes et feta','Omelette aux épinards et champignons'],['Mercredi','Fromage blanc, pomme et amandes','Riz, tofu et brocoli','Poulet grillé, légumes rôtis et salade'],['Jeudi','Avoine, banane et yaourt','Salade de pois chiches, concombre et feta','Crevettes sautées aux légumes'],['Vendredi','Œufs brouillés, pain complet et fruit','Pâtes, tomate et thon','Courgettes farcies au poulet, salade'],['Samedi','Yaourt, fruits rouges et noix','Patate douce, saumon et légumes','Soupe de légumes et tartine au fromage'],['Dimanche','Pancakes à l’avoine et fruits','Poulet rôti, quinoa et légumes','Salade composée, œuf et avocat']];
function menus(){return `<section class="card wide"><h2>Menus de la semaine 🌿</h2><p class="muted small">Des idées équilibrées et adaptables. Les dîners sont proposés sans féculents ; ajustez selon votre faim, vos besoins et vos préférences.</p>${menuDays.map(([d,b,l,din])=>`<div class="daymenu"><strong>${d}</strong><div class="small"><b>Petit-déjeuner</b> · ${b}</div><div class="small"><b>Déjeuner</b> · ${l}</div><div class="small"><b>Dîner</b> · ${din}</div></div>`).join('')}</section><section class="card wide"><h3>Une note bienveillante</h3><p class="small muted">Ce menu est une source d’inspiration, pas une prescription médicale. Les féculents peuvent être importants pour vos besoins : adaptez ces propositions et demandez conseil à un professionnel de santé si nécessaire.</p></section>`}
function weight(){let sorted=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date)),latest=sorted.at(-1),svg='';if(sorted.length){let vals=sorted.map(x=>+x.kg),min=Math.min(...vals,state.goalWeight)-2,max=Math.max(...vals,state.goalWeight)+2;if(max===min)max=min+1;let pts=sorted.map((x,i)=>`${sorted.length===1?150:20+i*260/(sorted.length-1)},${190-(x.kg-min)*150/(max-min)}`).join(' ');svg=`<svg class="chart" viewBox="0 0 300 220" role="img" aria-label="Graphique du suivi de poids"><line x1="15" y1="190" x2="290" y2="190" stroke="#eee"/><polyline points="${pts}" fill="none" stroke="#d96e8d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${sorted.map((x,i)=>{let [px,py]=pts.split(' ')[i].split(',');return `<circle cx="${px}" cy="${py}" r="5" fill="#d96e8d"/><text x="${px}" y="${+py-10}" text-anchor="middle" font-size="10" fill="#806d74">${x.kg}</text>`}).join('')}<text x="15" y="212" font-size="10" fill="#988890">${esc(sorted[0].date)}</text><text x="285" y="212" text-anchor="end" font-size="10" fill="#988890">${esc(sorted.at(-1).date)}</text></svg>`}return `<section class="card"><h2>Suivi du poids</h2><p class="muted small">Un repère parmi d’autres : votre bien-être ne se résume pas à un chiffre.</p><div class="row"><div class="field"><label>Poids actuel (kg)</label><input id="weightValue" type="number" min="1" step="0.1" placeholder="Ex. 68.5"></div><button class="btn" id="saveWeight">Enregistrer</button></div><div class="field"><label>Mon objectif personnalisable (kg)</label><div class="row"><input id="goalWeight" type="number" min="1" step="0.1" value="${esc(state.goalWeight)}"><button class="btn secondary" id="saveGoal">Enregistrer l’objectif</button></div></div>${latest?`<div class="stats"><div class="stat"><b>${latest.kg} kg</b><span>dernier relevé</span></div><div class="stat"><b>${state.goalWeight} kg</b><span>objectif</span></div><div class="stat"><b>${(latest.kg-state.goalWeight).toFixed(1)} kg</b><span>écart à l’objectif</span></div></div>`:''}</section><section class="card"><h3>Évolution</h3>${svg||'<div class="empty"><b>Votre graphique apparaîtra ici</b>Enregistrez votre premier relevé quand vous le souhaitez.</div>'}</section><section class="card wide"><h3>Historique</h3>${sorted.length?`<div class="list">${sorted.slice().reverse().map((x,i)=>`<div class="item"><div><strong>${esc(x.date)}</strong><div class="meta">Relevé de poids</div></div><div class="item-actions"><b class="kcal">${x.kg} kg</b><button class="btn danger smallbtn" data-remove-weight="${sorted.length-1-i}">✕</button></div></div>`).join('')}</div>`:'<div class="empty">Aucun relevé enregistré.</div>'}</section><section class="card wide"><h3>Mes données</h3><p class="small muted">Vos informations restent sur cet appareil. Exportez une sauvegarde ou restaurez un fichier JSON.</p><div class="toolbar"><button class="btn secondary" id="exportData">Exporter mes données</button><label class="btn ghost" for="importFile">Importer une sauvegarde</label><input id="importFile" type="file" accept="application/json,.json" hidden></div></section>`}
function render(){renderTabs();let views={home,nutrition,recipes,sport,menus,weight};document.getElementById('app').innerHTML=views[state.active]();bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.active=b.dataset.tab;save();render()});document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{state.active=b.dataset.goto;save();render()});
const fs=document.getElementById('foodSearch');if(fs){const results=document.getElementById('foodResults'),sel=document.getElementById('foodSelect'),grams=document.getElementById('foodGrams'),calc=document.getElementById('foodCalc');function refreshFood(){calc.textContent=`${grams.value||0} g = ${Math.round((+grams.value||0)*foods[sel.value].kcal/100)} kcal`}fs.oninput=()=>{let q=fs.value.trim().toLowerCase();results.innerHTML=q?foods.map((f,i)=>({f,i})).filter(x=>x.f.name.toLowerCase().includes(q)).slice(0,12).map(x=>`<button class="food-choice" data-pick-food="${x.i}"><span>${esc(x.f.name)}</span><b>${x.f.kcal} kcal/100 g</b></button>`).join(''):'<div class="small muted">Commencez à saisir pour rechercher un aliment.</div>';results.querySelectorAll('[data-pick-food]').forEach(b=>b.onclick=()=>{sel.value=b.dataset.pickFood;fs.value=foods[sel.value].name;results.innerHTML='';refreshFood()})};sel.onchange=refreshFood;grams.oninput=refreshFood;document.getElementById('addFood').onclick=()=>{let g=+grams.value;if(!g||g<1){alert('Entrez une quantité en grammes supérieure à zéro.');return}let f=foods[sel.value];log().foods.push({name:f.name,grams:g,kcal:g*f.kcal/100});save();render()};document.querySelectorAll('[data-remove-food]').forEach(b=>b.onclick=()=>{log().foods.splice(+b.dataset.removeFood,1);save();render()})}
const ing=document.getElementById('ingredients');if(ing){const update=()=>{let total=[...ing.querySelectorAll('.recipe-ing')].reduce((s,r)=>s+foods[r.querySelector('.ing-food').value].kcal*(+r.querySelector('.ing-grams').value||0)/100,0),p=Math.max(1,+document.getElementById('portions').value||1);document.getElementById('recipeTotal').textContent=`Total recette : ${Math.round(total)} kcal · par portion : ${Math.round(total/p)} kcal`};ing.oninput=update;ing.onchange=update;document.getElementById('portions').oninput=update;document.getElementById('addIngredient').onclick=()=>{ing.insertAdjacentHTML('beforeend',ingRow());bindRemoveIng();update()};function bindRemoveIng(){ing.querySelectorAll('.remove-ing').forEach(b=>b.onclick=()=>{if(ing.querySelectorAll('.recipe-ing').length>1)b.closest('.recipe-ing').remove();update()})}bindRemoveIng();document.getElementById('saveRecipe').onclick=()=>{let name=document.getElementById('recipeName').value.trim(),portions=Math.max(1,+document.getElementById('portions').value||1),ingredients=[...ing.querySelectorAll('.recipe-ing')].map(r=>{let f=foods[r.querySelector('.ing-food').value],grams=Math.max(0,+r.querySelector('.ing-grams').value||0);return {name:f.name,grams,kcal:f.kcal*grams/100}}).filter(x=>x.grams);if(!name||!ingredients.length){alert('Ajoutez un nom et au moins un ingrédient avec une quantité.');return}let total=ingredients.reduce((s,x)=>s+x.kcal,0);state.recipes.push({name,portions,ingredients,total,perPortion:total/portions});save();render()};document.querySelectorAll('[data-recipe-add]').forEach(b=>b.onclick=()=>{let r=state.recipes[+b.dataset.recipeAdd];log().foods.push({name:`${r.name} (1 portion)`,grams:0,kcal:r.perPortion});save();render()});document.querySelectorAll('[data-recipe-remove]').forEach(b=>b.onclick=()=>{state.recipes.splice(+b.dataset.recipeRemove,1);save();render()})}
const act=document.getElementById('activity');if(act){let estimate=()=>{let d=+document.getElementById('distance').value||0,t=+document.getElementById('duration').value||0,rate={run:10,walk:4,hike:7}[act.value],k=Math.round((t/60)*rate*65);document.getElementById('cardioEstimate').textContent=`Calories estimées : ${k||'—'} kcal${d?` · ${d} km`:''}`;return {d,t,k}};act.onchange=estimate;document.getElementById('distance').oninput=estimate;document.getElementById('duration').oninput=estimate;document.getElementById('addCardio').onclick=()=>{let {d,t,k}=estimate();if(!t&&!d){alert('Indiquez une distance ou une durée.');return}let key=act.value,name={run:'Course à pied',walk:'Marche',hike:'Randonnée'}[key];log().sports.push({name,detail:`${d||0} km · ${t||0} min`,kcal:k});state.sports.push({date:day,name,detail:`${d||0} km · ${t||0} min`,kcal:k});save();render()};document.getElementById('addStrength').onclick=()=>{let exercise=document.getElementById('exercise').value.trim();if(!exercise){alert('Indiquez le nom de l’exercice.');return}let muscle=document.getElementById('muscle').value,sets=+document.getElementById('sets').value||1,reps=+document.getElementById('reps').value||1,load=+document.getElementById('load').value||0,item={name:`${exercise} · ${muscle}`,detail:`${sets} séries × ${reps} répétitions · ${load} kg`,kcal:0};log().sports.push(item);state.sports.push({...item,date:day});save();render()};document.querySelectorAll('[data-remove-sport]').forEach(b=>b.onclick=()=>{let item=log().sports.splice(+b.dataset.removeSport,1)[0];let i=state.sports.findIndex(x=>x.date===day&&x.name===item.name&&x.detail===item.detail);if(i>=0)state.sports.splice(i,1);save();render()})}
if(document.getElementById('saveWeight'))document.getElementById('saveWeight').onclick=()=>{let kg=+document.getElementById('weightValue').value;if(!kg||kg<1){alert('Entrez un poids valide en kg.');return}state.weights.push({date:day,kg});save();render()};if(document.getElementById('saveGoal'))document.getElementById('saveGoal').onclick=()=>{let x=+document.getElementById('goalWeight').value;if(!x||x<1){alert('Entrez un objectif valide.');return}state.goalWeight=x;save();render()};document.querySelectorAll('[data-remove-weight]').forEach(b=>b.onclick=()=>{let s=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date));state.weights.splice(state.weights.indexOf(s[+b.dataset.removeWeight]),1);save();render()});let ex=document.getElementById('exportData');if(ex)ex.onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`rose-forme-sauvegarde-${today()}.json`;a.click();URL.revokeObjectURL(a.href)};let im=document.getElementById('importFile');if(im)im.onchange=async()=>{try{let incoming=JSON.parse(await im.files[0].text());if(!incoming||typeof incoming!=='object'||!incoming.logs)throw Error();state={...defaults,...incoming};save();alert('Sauvegarde importée avec succès.');render()}catch{alert('Fichier invalide : choisissez une sauvegarde Rose & Forme au format JSON.')}im.value=''};
}
dateEl.onchange=()=>{day=dateEl.value||today();render()};render();
})();
</script>
